        "@context": "https://schema.org",

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Optional analytics: only injected when both env vars are actually set at build time,
      so we never ship a broken request pointing at an undefined endpoint. Set
      VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID in your environment to enable.
    -->
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src = `${endpoint}/umami`;
        s.dataset.websiteId = websiteId;
        document.head.appendChild(s);
      }
    </script>
  </body>
